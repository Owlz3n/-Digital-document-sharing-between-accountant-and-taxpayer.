<!doctype html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finans Yöneticisi - Fatura Ekle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>@view-transition { navigation: auto; }</style>
</head>
<body class="h-full bg-gradient-to-br from-blue-50 to-indigo-100 font-sans">
  <div class="h-full flex flex-col">
    
    <header class="bg-white shadow-sm border-b border-gray-200 px-4 py-3">
      <div class="flex items-center justify-between">
        <h1 id="app-title" class="text-xl font-bold text-gray-800">Finans Yöneticisi</h1>
        <div class="flex items-center space-x-2">
          <span id="currency-display" class="text-sm text-gray-600">₺</span>
          <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center">
            <span class="text-white text-sm font-medium">F</span>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto">
      <div id="add-invoice-page" class="h-full p-4 fade-in">
        <div class="max-w-md mx-auto">
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Yeni Fatura Ekle</h2>
            <form id="invoice-form" class="space-y-4">
              <div>
                <label for="invoice-title" class="block text-sm font-medium text-gray-700 mb-1">Fatura Başlığı</label>
                <input type="text" id="invoice-title" name="title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Elektrik faturası">
              </div>
              <div>
                <label for="invoice-amount" class="block text-sm font-medium text-gray-700 mb-1">Tutar</label>
                <input type="number" id="invoice-amount" name="amount" required step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="0.00">
              </div>
              <div>
                <label for="invoice-date" class="block text-sm font-medium text-gray-700 mb-1">Tarih</label>
                <input type="date" id="invoice-date" name="date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <div>
                <label for="invoice-category" class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                <select id="invoice-category" name="category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                  <option value="">Kategori seçin</option>
                  <option value="Elektrik">Elektrik</option>
                  <option value="Su">Su</option>
                  <option value="Doğalgaz">Doğalgaz</option>
                  <option value="İnternet">İnternet</option>
                  <option value="Telefon">Telefon</option>
                  <option value="Kira">Kira</option>
                  <option value="Diğer">Diğer</option>
                </select>
              </div>
              <div>
                <label for="invoice-status" class="block text-sm font-medium text-gray-700 mb-1">Durum</label>
                <select id="invoice-status" name="status" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                  <option value="Bekliyor">Bekliyor</option>
                  <option value="Ödendi">Ödendi</option>
                </select>
              </div>
              <div class="flex space-x-3 pt-4">
                <button type="submit" id="save-invoice-btn" class="flex-1 bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors"> Kaydet </button>
                <button type="button" onclick="window.location.href='index.html'" class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors"> İptal </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <nav class="bg-white border-t border-gray-200 px-4 py-2">
      <div class="flex justify-around">
        <a href="anasayfa.html" class="nav-btn flex flex-col items-center py-2 px-3 rounded-lg transition-colors" data-page="home">
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <span class="text-xs">Ana Sayfa</span>
        </a>
        <a href="faturaekle.html" class="nav-btn flex flex-col items-center py-2 px-3 rounded-lg transition-colors" data-page="add-invoice">
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span class="text-xs">Fatura Ekle</span>
        </a>
        <a href="faturalarım.html" class="nav-btn flex flex-col items-center py-2 px-3 rounded-lg transition-colors" data-page="invoices">
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span class="text-xs">Faturalarım</span>
        </a>
        <a href="ayarlar.html" class="nav-btn flex flex-col items-center py-2 px-3 rounded-lg transition-colors" data-page="settings">
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span class="text-xs">Ayarlar</span>
        </a>
      </div>
    </nav>

  </div>

  <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 m-4 max-w-sm w-full slide-up">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Tüm Verileri Sil</h3>
      <p class="text-gray-600 mb-4">Bu işlem geri alınamaz. Tüm faturalarınız silinecek.</p>
      <div class="flex space-x-3">
        <button onclick="deleteAllData()" class="flex-1 bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition-colors"> Sil </button>
        <button onclick="hideDeleteConfirmation()" class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors"> İptal </button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg hidden z-50">
    <span id="toast-message">İşlem başarılı!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
