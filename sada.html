<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MİS TEMİZLİK AMBALAJ — Mockup</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Page baseline */
    :root{
      --canvas: #eef3f4;                /* pale bluish-gray background */
      --glow:  rgba(218,254,122,0.18); /* soft radial glow tint */
      --panel:  #ffffff;
      --btn-bg: #f3f6f7;
      --btn-border: rgba(20,20,20,0.65);
      --title-color:#0f1720;
      --muted: #54606a;
      --btn-font: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      --title-font: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      --page-width: 1200px;
      --max-mockup-w: 1200px;
    }

    html,body{
      height:100%;
      margin:0;
      background-color: var(--canvas);
      font-family: var(--btn-font);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      color:var(--title-color);
    }

    /* Centered stage sized to look like a 1920x768 mockup while responsive */
    .stage{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px;
      box-sizing:border-box;
      background-image:
        radial-gradient(circle at 50% 8%, var(--glow) 0%, rgba(218,254,122,0.06) 12%, transparent 88%);
    }

    /* Mockup card: fixed aspect feel but responsive */
    .mockup{
      width: min(var(--max-mockup-w), 92vw);
      max-width: 1400px;
      background: transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      box-sizing:border-box;
    }

    /* Title: two lines, uppercase, Montserrat Bold ~96px */
    .title{
      text-align:center;
      line-height:0.92;
      text-transform:uppercase;
      letter-spacing:4px;
      margin:0;
      padding:0 12px;
      font-family: var(--title-font);
      font-weight:800;
      color:var(--title-color);
      /* scale responsively but approximate 96px at wide view */
      font-size: clamp(40px, 6.0vw, 96px);
    }

    /* Grid of pill buttons: 2 columns x 3 rows */
    .controls{
      width:100%;
      max-width: var(--page-width);
      display:grid;
      gap:20px;
      grid-template-columns: repeat(2, 1fr);
      justify-items:center;
      align-items:center;
      box-sizing:border-box;
      padding: 0 12px;
    }

    /* Each pill container centers the button */
    .pill {
      width: 380px;
      height: 68px;
      background: var(--btn-bg);
      border-radius: 999px;               /* pill */
      border: 1.5px solid var(--btn-border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: var(--btn-font);
      font-weight:600;
      font-size: 24px;
      color: var(--title-color);
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 18px rgba(14,20,24,0.04);
      transition: transform .14s ease, box-shadow .14s ease, background-color .14s ease;
    }

    .pill:focus{
      outline: 3px solid rgba(63, 192, 116, 0.18);
      outline-offset: 4px;
    }

    .pill:hover{
      transform: translateY(-6px);
      box-shadow: 0 22px 40px rgba(14,20,24,0.08);
    }

    /* Make sure text wraps nicely on very small screens */
    .pill span{
      display:inline-block;
      padding: 0 14px;
      line-height:1;
      white-space:nowrap;
      text-overflow:ellipsis;
      overflow:hidden;
    }

    /* Footer centered */
    .footer{
      font-size:14px;
      color:var(--muted);
      text-align:center;
      padding:8px 12px;
    }

    /* Responsive rules: scale buttons and change grid to single column on small viewports */
    @media (max-width:980px){
      .controls{
        grid-template-columns: repeat(1, 1fr);
      }
      .pill{
        width: min(88%, 520px);
        height: 64px;
        font-size: 22px;
      }
      .title{
        letter-spacing:3px;
      }
    }

    @media (max-width:420px){
      .pill{
        width: 92%;
        height: 56px;
        font-size: 18px;
      }
      .title{
        font-size: clamp(28px, 9.5vw, 56px);
        letter-spacing:2px;
      }
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce){
      .pill, .pill:hover{
        transition: none !important;
        transform: none !important;
        box-shadow: none !important;
      }
    }

    /* Utility: make buttons visually focusable for keyboard users */
    button.pill { background: none; border: none; padding: 0; margin: 0; width: 100%; height:100%; cursor:pointer; }
  </style>
</head>
<body>
  <div class="stage">
    <main class="mockup" role="main" aria-label="MİS Temizlik Ambalaj arayüz önizleme">
      <h1 class="title" aria-hidden="false">MİS TEMİZLİK<br>AMBALAJ</h1>

      <section class="controls" role="navigation" aria-label="Ana eylemler">
        <div>
          <button class="pill" type="button" aria-label="Faturalarım">
            <span>Faturalarım</span>
          </button>
        </div>

        <div>
          <button class="pill" type="button" aria-label="Fatura ekle">
            <span>Fatura ekle</span>
          </button>
        </div>

        <div>
          <button class="pill" type="button" aria-label="Muhasebeciler">
            <span>Muhasebeciler</span>
          </button>
        </div>

        <div>
          <button class="pill" type="button" aria-label="Kullanıcılar">
            <span>Kullanıcılar</span>
          </button>
        </div>

        <div>
          <button class="pill" type="button" aria-label="Cari Bilgilerim">
            <span>Cari Bilgilerim</span>
          </button>
        </div>

        <div>
          <button class="pill" type="button" aria-label="Ayarlar">
            <span>Ayarlar</span>
          </button>
        </div>
      </section>

      <footer class="footer" role="contentinfo" aria-label="İletişim bilgisi">
        @Copyright info.atacansahin@gmail.com
      </footer>
    </main>
  </div>
</body>
</html>
